<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>AudioMod</title>
	</head>
	<body>
		<h1>AudioMod</h1>

		<p id="status" role="status">Loading…</p>

		<button id="start" type="button" disabled>Start on this tab</button>
		<button id="stop" type="button" disabled>Stop processing</button>
		<button id="reset" type="button" disabled>Reset effects</button>

		<p>
			<label for="volume">Volume</label>
			<output id="volume-value" for="volume">100%</output>
		</p>

		<input
			id="volume"
			type="range"
			min="0"
			max="200"
			step="1"
			value="100"
			disabled
		/>

		<p>
			<label for="reverb">Reverb strength</label>
			<output id="reverb-value" for="reverb">0%</output>
		</p>

		<input
			id="reverb"
			type="range"
			min="0"
			max="100"
			step="1"
			value="0"
			disabled
		/>

		<fieldset id="equalizer" disabled>
			<legend>Equalizer</legend>
			<div id="eq-bands"></div>
		</fieldset>

		<script type="module" src="popup.js"></script>
	</body>
</html>
